<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>captureAIshi</title>
<style>
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-elevated: #1a1a1a;
  --bg-overlay: #222222;
  --bg-hover: rgba(255,255,255,0.04);
  --bg-selected: rgba(255,255,255,0.08);

  --border-subtle: rgba(255,255,255,0.08);
  --border-default: rgba(255,255,255,0.12);
  --border-strong: rgba(255,255,255,0.20);

  --text-primary: #ededed;
  --text-secondary: #a0a0a0;
  --text-tertiary: #5a5a5a;
  --text-placeholder: #3a3a3a;

  --accent: #5b8af0;
  --accent-hover: #7ba3f7;
  --accent-dim: rgba(91,138,240,0.15);
  --success: #3ecf8e;
  --success-dim: rgba(62,207,142,0.12);
  --warning: #f5a623;
  --warning-dim: rgba(245,166,35,0.10);
  --danger: #f03e3e;
  --danger-dim: rgba(240,62,62,0.10);
  --info: #60a5fa;
  --orange: #f5a623;

  --radius: 4px;
  --radius-md: 6px;

  --font: 'Inter', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }

body {
  font-family: var(--font);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-base);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

/* ─── Toolbar ─── */
.toolbar {
  height: 40px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  flex-shrink: 0;
  -webkit-app-region: drag;
}
.toolbar-logo {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-right: 4px;
}
.toolbar-logo b { color: var(--accent); font-weight: 600; }
.toolbar-sep {
  width: 1px;
  height: 16px;
  background: var(--border-default);
}
.toolbar-spacer { flex: 1; }

/* Buttons */
.btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.1s, border-color 0.1s;
  -webkit-app-region: no-drag;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-overlay); border-color: var(--border-strong); }
.btn:active { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger {
  background: var(--danger-dim);
  border-color: rgba(240,62,62,0.3);
  color: var(--danger);
}
.btn-danger:hover { background: rgba(240,62,62,0.18); }

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius);
}
.badge-idle { background: var(--bg-selected); color: var(--text-secondary); }
.badge-running { background: var(--success-dim); color: var(--success); }
.badge-error { background: var(--danger-dim); color: var(--danger); }
.badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.badge-running .dot { animation: pulse 1.5s infinite; }
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Select */
.sel {
  font-family: var(--font);
  font-size: 12px;
  height: 28px;
  padding: 0 24px 0 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l3 3 3-3' stroke='%235a5a5a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 7px center;
}
.sel:hover { border-color: var(--border-strong); }
.sel:focus { outline: none; border-color: var(--accent); }

/* Toggle */
.tog { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text-secondary); user-select: none; }
.tog input { display: none; }
.tog .track {
  width: 32px; height: 18px;
  background: rgba(255,255,255,0.12);
  border-radius: 9px;
  position: relative;
  transition: background 0.15s;
  flex-shrink: 0;
}
.tog .track::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform 0.15s;
}
.tog input:checked + .track { background: var(--success); }
.tog input:checked + .track::after { transform: translateX(14px); }

/* ─── Layout ─── */
.layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ─── Resizer Handle ─── */
.resizer {
  width: 5px;
  flex-shrink: 0;
  cursor: col-resize;
  background: transparent;
  position: relative;
  z-index: 10;
  transition: background 0.15s;
}
.resizer::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 2px;
  width: 1px;
  background: var(--border-subtle);
  transition: background 0.15s;
}
.resizer:hover, .resizer.active {
  background: var(--accent-dim);
}
.resizer:hover::after, .resizer.active::after {
  background: var(--accent);
}

/* ─── Left Sidebar (Params) ─── */
.sidebar {
  width: 260px;
  min-width: 180px;
  max-width: 500px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-right: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 8px 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

/* Sections */
.sec { border-bottom: 1px solid var(--border-subtle); }
.sec:last-child { border-bottom: none; }
.sec-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
  background: none;
  border: none;
  width: 100%;
  font-family: var(--font);
}
.sec-head:hover { color: var(--text-primary); }
.sec-head .arr {
  font-size: 8px;
  color: var(--text-tertiary);
  transition: transform 0.12s;
  display: inline-block;
}
.sec-head.open .arr { transform: rotate(90deg); }
.sec-body { display: none; padding: 4px 12px 8px; }
.sec-body.open { display: block; }

/* Form fields */
.f { margin-bottom: 6px; }
.f:last-child { margin-bottom: 0; }
.f label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-tertiary);
  margin-bottom: 3px;
}
.f input, .f select {
  width: 100%;
  font-family: var(--font);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  background: var(--bg-base);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  padding: 4px 8px;
  height: 28px;
  transition: border-color 0.1s;
}
.f input:focus, .f select:focus {
  outline: none;
  border-color: var(--accent);
}
.f input::placeholder { color: var(--text-placeholder); }
.row { display: flex; gap: 6px; }
.row .f { flex: 1; min-width: 0; }

/* Presets (compact list) */
.preset-list { display: flex; flex-direction: column; gap: 2px; }
.preset-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.preset-item:hover { background: var(--bg-hover); }
.preset-item.selected { background: var(--accent-dim); border-color: rgba(91,138,240,0.25); }
.preset-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
.pi-name { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.pi-tags { display: flex; gap: 3px; margin-left: auto; }
.pi-tag {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(255,255,255,0.06);
  color: var(--text-tertiary);
}
.preset-item.selected .pi-tag { background: rgba(91,138,240,0.2); color: var(--accent); }

/* ─── Center (Log) ─── */
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 200px;
}
.center-header {
  height: 32px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.center-tab {
  cursor: pointer;
  color: var(--text-tertiary);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 0;
  border-bottom: 2px solid transparent;
}
.center-tab:hover { color: var(--text-secondary); }
.center-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
.log-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  background: var(--bg-base);
}
.log-line {
  padding: 1px 12px 1px 10px;
  border-left: 2px solid transparent;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-info { color: var(--text-secondary); }
.log-warn { color: var(--warning); border-left-color: var(--warning); background: var(--warning-dim); }
.log-error { color: var(--danger); border-left-color: var(--danger); background: var(--danger-dim); }
.log-success { color: var(--success); border-left-color: var(--success); background: var(--success-dim); }
.log-capture { color: var(--info); border-left-color: var(--info); background: rgba(96,165,250,0.06); }
.log-progress { color: var(--orange); border-left-color: var(--orange); }

/* ─── Right Panel (Preview) ─── */
.preview {
  width: 320px;
  min-width: 180px;
  max-width: 600px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-left: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-header {
  height: 32px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.preview-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  align-content: start;
}
.preview-card {
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: border-color 0.1s;
}
.preview-card:hover { border-color: var(--border-strong); }
.preview-card img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: var(--bg-elevated);
}
.preview-card .pc-label {
  padding: 3px 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gallery-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.gallery-controls .sel { height: 22px; font-size: 10px; padding: 0 4px; }
.gallery-controls .thumb-size {
  width: 48px;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: var(--border-default);
  border-radius: 2px;
  outline: none;
}
.gallery-controls .thumb-size::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.gallery-stats {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-left: auto;
}
.preview-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 32px 12px;
  color: var(--text-tertiary);
  font-size: 12px;
  line-height: 1.6;
}

/* ─── Progress Bar ─── */
.progress-wrap {
  padding: 6px 12px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
  display: none;
}
.progress-wrap.visible { display: block; }
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.progress-info .pose-label { color: var(--text-primary); font-weight: 500; }
.progress-track {
  height: 4px;
  background: var(--bg-base);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width 0.3s;
}

/* ─── Lightbox ─── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.12s, visibility 0.12s;
}
.lightbox.open { opacity: 1; visibility: visible; }
.lightbox-top {
  position: absolute;
  top: 12px;
  display: flex;
  gap: 4px;
  z-index: 102;
}
.lightbox-tab {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
}
.lightbox-tab:hover { color: var(--text-primary); border-color: var(--border-strong); }
.lightbox-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.lightbox-close {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 20px;
  color: var(--text-secondary);
  cursor: pointer;
  background: none;
  border: none;
  z-index: 102;
  line-height: 1;
}
.lightbox-close:hover { color: var(--text-primary); }
.lightbox-img-wrap {
  position: relative;
  max-width: 90vw;
  max-height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.lightbox-img-wrap img {
  max-width: 90vw;
  max-height: calc(100vh - 80px);
  object-fit: contain;
  border-radius: var(--radius-md);
}
.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 24px;
  color: var(--text-secondary);
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 102;
}
.lightbox-arrow:hover { color: var(--text-primary); background: rgba(0,0,0,0.7); }
.lightbox-arrow.left { left: 16px; }
.lightbox-arrow.right { right: 16px; }
.lightbox-label {
  position: absolute;
  bottom: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-tertiary);
  background: rgba(0,0,0,0.6);
  padding: 3px 10px;
  border-radius: var(--radius);
  z-index: 102;
}

/* ─── Status Bar ─── */
.statusbar {
  height: 24px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  gap: 16px;
}
.statusbar-spacer { flex: 1; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* ─── Config Panel ─── */
.cfg-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  transition: background 0.1s;
}
.cfg-row:hover { background: var(--bg-hover); }
.cfg-row .cfg-name { flex: 1; font-weight: 500; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfg-row .cfg-meta { font-size: 10px; color: var(--text-tertiary); font-family: var(--font-mono); }
.cfg-row .cfg-del {
  opacity: 0;
  font-size: 11px;
  color: var(--danger);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 2px;
  font-family: var(--font);
}
.cfg-row:hover .cfg-del { opacity: 0.7; }
.cfg-row:hover .cfg-del:hover { opacity: 1; }
.cfg-actions { display: flex; gap: 4px; padding: 4px 8px 2px; }
.cfg-actions .btn { flex: 1; font-size: 11px; height: 24px; justify-content: center; }
.cfg-empty { padding: 8px; font-size: 11px; color: var(--text-tertiary); text-align: center; }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <span class="toolbar-logo"><b>capture</b>AIshi</span>
  <div class="toolbar-sep"></div>
  <button class="btn btn-accent" id="btnStart" onclick="startCapture()">&#9654;&#xFE0E; Start</button>
  <button class="btn btn-danger" id="btnStop" onclick="stopCapture()" style="display:none">&#9632;&#xFE0E; Stop</button>
  <div class="toolbar-sep"></div>
  <select class="sel" id="presetSelect" onchange="selectPresetById(this.value)">
    <option value="">Preset...</option>
  </select>
  <select class="sel" id="driver" onchange="updateVisibility()">
    <option value="manual">Manual</option>
    <option value="ue5">UE5</option>
    <option value="unity">Unity</option>
    <option value="cheatengine">CE</option>
  </select>
  <select class="sel" id="grabber" onchange="updateVisibility()">
    <option value="none">No Grab</option>
    <option value="renderdoc">RenderDoc</option>
    <option value="screenshot">Screenshot</option>
  </select>
  <div class="toolbar-sep"></div>
  <label class="tog"><input type="checkbox" id="clean_start" checked><div class="track"></div>Clean</label>
  <label class="tog"><input type="checkbox" id="dry_run"><div class="track"></div>Dry</label>
  <div class="toolbar-spacer"></div>
  <div id="statusBadge" class="badge badge-idle"><div class="dot"></div><span id="statusText">Idle</span></div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">Parameters</div>
    <div class="sidebar-body">

      <!-- Presets -->
      <div class="sec">
        <button class="sec-head open" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Presets</button>
        <div class="sec-body open"><div class="preset-list" id="presetList"></div></div>
      </div>

      <!-- Volume -->
      <div class="sec">
        <button class="sec-head open" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Capture Volume</button>
        <div class="sec-body open">
          <div class="f"><label>Min (X, Y, Z)</label>
            <div class="row">
              <div class="f"><input type="number" id="vol_min_x" value="-5" step="0.5"></div>
              <div class="f"><input type="number" id="vol_min_y" value="0" step="0.5"></div>
              <div class="f"><input type="number" id="vol_min_z" value="-5" step="0.5"></div>
            </div>
          </div>
          <div class="f"><label>Max (X, Y, Z)</label>
            <div class="row">
              <div class="f"><input type="number" id="vol_max_x" value="5" step="0.5"></div>
              <div class="f"><input type="number" id="vol_max_y" value="3" step="0.5"></div>

<script>
// ─── Resizable Panels ───
(function initResizers() {
  const sidebar = document.querySelector('.sidebar');
  const preview = document.querySelector('.preview');
  const rL = document.getElementById('resizerLeft');
  const rR = document.getElementById('resizerRight');

  function startDrag(e, resizer, mode) {
    e.preventDefault();
    const startX = e.clientX;
    const startW = mode === 'left' ? sidebar.offsetWidth : preview.offsetWidth;
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const dx = ev.clientX - startX;
      if (mode === 'left') {
        sidebar.style.width = Math.max(180, Math.min(500, startW + dx)) + 'px';
      } else {
        preview.style.width = Math.max(180, Math.min(600, startW - dx)) + 'px';
      }
    }
    function onUp() {
      resizer.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  rL.addEventListener('mousedown', function(e) { startDrag(e, rL, 'left'); });
  rR.addEventListener('mousedown', function(e) { startDrag(e, rR, 'right'); });
})();

// ─── State ───
let polling = null, presets = [], selectedPresetId = null;
let knownCaptures = [], activeSession = '', viewSession = '';

// ─── Sections ───
function toggleSec(btn) { btn.classList.toggle('open'); btn.nextElementSibling.classList.toggle('open'); }

// ─── Presets ───
const presetIcons = { gamepad:'\u{1F3AE}', cube:'\u{1F4E6}', unity:'\u{1F3AE}', wrench:'\u{1F527}', flask:'\u{1F9EA}' };

async function loadPresets() {
  try {
    const r = await fetch('/api/presets');
    presets = await r.json();
    const sel = document.getElementById('presetSelect');
    sel.innerHTML = '<option value="">Preset...</option>';
    presets.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    renderPresetList();
  } catch(e) { console.error(e); }
}

function renderPresetList() {
  const list = document.getElementById('presetList');
  list.innerHTML = '';
  presets.forEach(p => {
    const icon = presetIcons[p.icon] || '\u{1F4CB}';
    const d = document.createElement('div');
    d.className = 'preset-item';
    d.dataset.id = p.id;
    d.onclick = () => selectPresetById(p.id);
    d.innerHTML = `<span class="preset-icon">${icon}</span><span class="pi-name">${p.name}</span><span class="pi-tags">${p.tags.map(t=>`<span class="pi-tag">${t}</span>`).join('')}</span>`;
    list.appendChild(d);
  });
}

function selectPresetById(id) {
  if (!id) return;
  selectedPresetId = id;
  const preset = presets.find(p => p.id === id);
  if (!preset) return;
  document.getElementById('presetSelect').value = id;
  document.querySelectorAll('.preset-item').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
  applyParams(preset.params);
  const dl = {manual:'Manual',ue5:'UE5',unity:'Unity',cheatengine:'CE'};
  const gl = {none:'None',renderdoc:'RDoc',screenshot:'Scrn'};
  document.getElementById('configSummary').textContent = `${preset.name} \u2022 ${dl[preset.params.driver]||preset.params.driver} \u2022 ${gl[preset.params.grabber]||preset.params.grabber} \u2022 ${preset.params.spacing}m`;
  addLog(`Preset: ${preset.name}`, 'info');
}

function applyParams(p) {
  document.getElementById('vol_min_x').value=p.volume_min[0]; document.getElementById('vol_min_y').value=p.volume_min[1]; document.getElementById('vol_min_z').value=p.volume_min[2];
  document.getElementById('vol_max_x').value=p.volume_max[0]; document.getElementById('vol_max_y').value=p.volume_max[1]; document.getElementById('vol_max_z').value=p.volume_max[2];
  document.getElementById('spacing').value=p.spacing;
  document.getElementById('smooth').checked=p.smooth; document.getElementById('smooth_points').value=p.smooth_points;
  document.getElementById('cone_angle').value=p.cone_angle; document.getElementById('cone_samples').value=p.cone_samples; document.getElementById('cone_rings').value=p.cone_rings;
  document.getElementById('driver').value=p.driver; document.getElementById('driver_host').value=p.driver_host; document.getElementById('driver_port').value=p.driver_port;
  document.getElementById('ce_mode').value=p.ce_mode; document.getElementById('grabber').value=p.grabber;
  document.getElementById('target_exe').value=p.target_exe||''; document.getElementById('renderdoc_path').value=p.renderdoc_path||''; document.getElementById('no_hide_ui').checked=p.no_hide_ui;
  document.getElementById('output_dir').value=p.output_dir; document.getElementById('dry_run').checked=p.dry_run;
  document.getElementById('streaming').checked=p.streaming!==false; document.getElementById('streaming_settle').value=p.streaming_settle||0.5;
  if(p.fov!=null) document.getElementById('fov').value=p.fov;
  if(p.aspect!=null) document.getElementById('aspect').value=p.aspect;
  updateVisibility();
}

// ─── Form ───
function pf(id){return parseFloat(document.getElementById(id).value)||0;}
function pi(id){return parseInt(document.getElementById(id).value)||0;}
function val(id){return document.getElementById(id).value;}
function cb(id){return document.getElementById(id).checked;}

function getFormData() {
  return {
    volume_min:[pf('vol_min_x'),pf('vol_min_y'),pf('vol_min_z')],
    volume_max:[pf('vol_max_x'),pf('vol_max_y'),pf('vol_max_z')],
    spacing:pf('spacing'), smooth:cb('smooth'), smooth_points:pi('smooth_points'),
    cone_angle:pf('cone_angle'), cone_samples:pi('cone_samples'), cone_rings:pi('cone_rings'),
    driver:val('driver'), driver_host:val('driver_host'), driver_port:pi('driver_port'), ce_mode:val('ce_mode'),
    grabber:val('grabber'), target_exe:val('target_exe'), renderdoc_path:val('renderdoc_path'), no_hide_ui:cb('no_hide_ui'),
    output_dir:val('output_dir'), dry_run:cb('dry_run'), clean_start:cb('clean_start'),
    streaming:cb('streaming'), streaming_settle:pf('streaming_settle'),
    fov:pf('fov'), aspect:pf('aspect'),
  };
}

// ─── Capture ───
async function startCapture() {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(getFormData()) });
    const r = await resp.json();
    if (!r.ok) { addLog('ERROR: '+r.error,'error'); btn.disabled=false; return; }
    setBadge('running');
    btn.style.display='none';
    document.getElementById('btnStop').style.display='';
    startPolling();
    loadRecent();
  } catch(e) { addLog('ERROR: '+e.message,'error'); btn.disabled=false; }
}
async function stopCapture() {
  try {
    await fetch('/api/stop', { method: 'POST' });
    addLog('Stop requested...', 'warn');
  } catch(e) {
    addLog('Failed to send stop: ' + e.message, 'error');
  }
}

function startPolling() {
  if(polling) clearInterval(polling);
  let last=0;
  polling = setInterval(async()=>{
    try {
      const r = await(await fetch('/api/status')).json();
      if(r.logs.length>last){ for(let i=last;i<r.logs.length;i++) addLog(r.logs[i]); last=r.logs.length; }
      if(!r.running){
        clearInterval(polling); polling=null;
        document.getElementById('btnStart').disabled=false;
        document.getElementById('btnStart').style.display='';
        document.getElementById('btnStop').style.display='none';
        if(r.error){ setBadge('error'); addLog('FAILED: '+r.error,'error'); }
        else { setBadge('idle'); addLog('Capture finished.','success'); }
      }
    } catch(_){}
  },500);
}

// ─── Log ───
function classifyLog(t) {
  const l=t.toLowerCase();
  if(l.includes('[error]')||l.includes('failed')||l.includes('exception')||l.includes('traceback')) return 'error';
  if(l.includes('[warning]')||l.includes('[warn]')||l.includes('timeout')||l.includes('retry')) return 'warn';
  if(l.includes('saved')||l.includes('complete')||l.includes('finished')||l.includes('success')||l.includes('done')) return 'success';
  if(l.includes('captured')||l.includes('frame')||l.includes('grabbed')||l.includes('screenshot')) return 'capture';
  if(/\d+\s*\/\s*\d+/.test(l)||l.includes('progress')||l.includes('waypoint')||l.includes('moving')) return 'progress';
  return 'info';
}
function addLog(text, force) {
  const body=document.getElementById('logBody');
  const d=document.createElement('div');
  d.className='log-line log-'+(force||classifyLog(text));
  d.textContent=text;
  body.appendChild(d);
  body.scrollTop=body.scrollHeight;
  document.getElementById('logCount').textContent=body.children.length+' lines';
  parseProgress(text);
}
function clearLogs(){ document.getElementById('logBody').innerHTML=''; document.getElementById('logCount').textContent='0 lines'; }
function setBadge(s) {
  const b=document.getElementById('statusBadge'), t=document.getElementById('statusText');
  b.className='badge badge-'+s;
  t.textContent=s.charAt(0).toUpperCase()+s.slice(1);
  if (s === 'idle' || s === 'error') resetProgress();
}

// ─── Visibility ───
function updateVisibility() {
  const h=(id,hide)=>{const el=document.getElementById(id);if(el)el.classList.toggle('hidden',hide);};
  h('smoothPointsWrap',!cb('smooth'));
  h('ceModeWrap',val('driver')!=='cheatengine');
  h('targetExeWrap',val('grabber')!=='renderdoc');
  h('targetArgsWrap',val('grabber')!=='renderdoc');
  h('rdocPathWrap',val('grabber')!=='renderdoc');
  h('streamingSettleWrap',!cb('streaming'));
}

// ─── Preview ───
async function pollSessions() {
  try {
    const d=await(await fetch('/api/sessions')).json();
    const sel=document.getElementById('sessionSelect');
    const cur=sel.value;
    sel.innerHTML='<option value="">All</option>';
    d.sessions.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    if(d.active&&d.active!==activeSession){activeSession=d.active;viewSession=d.active;sel.value=d.active;}
    else{sel.value=viewSession||cur;}
  } catch(_){}
}
function switchSession(s){viewSession=s;knownCaptures=[];pollCaptures();}
async function pollCaptures() {
  try {
    const url=viewSession?`/api/captures/${encodeURIComponent(viewSession)}`:'/api/captures';
    const d=await(await fetch(url)).json();
    if(d.files&&(d.files.length!==knownCaptures.length||d.session!==activeSession)){knownCaptures=d.files;renderPreviews(d.session);}
  } catch(_){}
}
function renderPreviews(session) {
  const body=document.getElementById('previewBody');
  if(!knownCaptures.length){body.innerHTML='<div class="preview-empty">No captures yet</div>';document.getElementById('captureCount').textContent='0';return;}
  body.innerHTML='';
  const sess=session||viewSession||activeSession;
  const filter = val('galleryFilter') || 'all';
  const sort = val('gallerySort') || 'newest';

  // Filter
  let files = [...knownCaptures];
  if (filter === 'rgb') files = files.filter(f => !/_d\.png$/i.test(f) && !/_n\.png$/i.test(f));
  else if (filter === 'depth') files = files.filter(f => /_d\.png$/i.test(f));
  else if (filter === 'normal') files = files.filter(f => /_n\.png$/i.test(f));

  // Sort
  if (sort === 'newest') files.reverse();
  else if (sort === 'name') files.sort((a,b) => a.localeCompare(b));
  // 'oldest' is default order from server

  document.getElementById('captureCount').textContent = files.length;

  // RGB-only list for lightbox indexing
  const rgbAll = knownCaptures.filter(f => !/_d\.png$/i.test(f) && !/_n\.png$/i.test(f));

  files.forEach(f => {
    const c=document.createElement('div');c.className='preview-card';
    const encodedPath=f.split('/').map(encodeURIComponent).join('/');
    const src=sess?`/api/captures/${encodeURIComponent(sess)}/${encodedPath}`:'';
    c.innerHTML=`<img src="${src}" loading="lazy" alt="${f}"><div class="pc-label">${f.split('/').pop()}</div>`;
    // Lightbox: find the corresponding RGB file
    const baseName = f.replace(/(_d|_n)\.png$/i, '.png');
    const rgbIdx = rgbAll.indexOf(baseName);
    if (rgbIdx >= 0) c.onclick = () => lbOpen(rgbIdx);
    body.appendChild(c);
  });

  // Stats
  fetchGalleryStats(sess);
}

function applyThumbSize() {
  const cols = parseInt(document.getElementById('thumbSize').value);
  const colMap = {1: '1fr', 2: '1fr 1fr', 3: '1fr 1fr 1fr', 4: 'repeat(4, 1fr)'};
  document.getElementById('previewBody').style.gridTemplateColumns = colMap[cols] || '1fr 1fr';
}

async function fetchGalleryStats(sess) {
  try {
    const url = sess ? `/api/session-stats/${encodeURIComponent(sess)}` : '/api/session-stats';
    const d = await (await fetch(url)).json();
    const sizeStr = d.size_bytes < 1048576
      ? (d.size_bytes / 1024).toFixed(0) + ' KB'
      : (d.size_bytes / 1048576).toFixed(1) + ' MB';
    document.getElementById('galleryStats').textContent = `${d.count} files · ${sizeStr}`;
  } catch(_) {}
}

// ─── Progress ───
let progTotal = 0, progCurrent = 0, progStartTime = 0, progPhase = 'capture';

function parseProgress(text) {
  // "Total camera poses: 120"
  let m = text.match(/Total camera poses:\s*(\d+)/i);
  if (m) { progTotal = parseInt(m[1]); progCurrent = 0; progPhase = 'capture'; progStartTime = Date.now(); updateProgress(); return; }
  // "Capturing pose 3/20" or "Progress: 15% (3/20)"
  m = text.match(/(?:pose|progress[^\d]*)\s*(\d+)\s*\/\s*(\d+)/i);
  if (m) { progCurrent = parseInt(m[1]); progTotal = parseInt(m[2]); progPhase = 'capture'; if (!progStartTime) progStartTime = Date.now(); updateProgress(); return; }
  // Phase 2: "Phase 2: Batch exporting N captures..."
  m = text.match(/Phase 2.*?(\d+)\s*captures/i);
  if (m) { progTotal = parseInt(m[1]); progCurrent = 0; progPhase = 'export'; progStartTime = Date.now(); updateProgress(); return; }
  // "Export 3/20:" or "Saving frame 3/20:"
  m = text.match(/(?:Export|Saving frame)\s*(\d+)\s*\/\s*(\d+)/i);
  if (m) { progCurrent = parseInt(m[1]); progTotal = parseInt(m[2]); progPhase = 'export'; if (!progStartTime) progStartTime = Date.now(); updateProgress(); return; }
}

function updateProgress() {
  const wrap = document.getElementById('progressWrap');
  if (progTotal <= 0) { wrap.classList.remove('visible'); return; }
  wrap.classList.add('visible');
  const pct = Math.min(100, (progCurrent / progTotal) * 100);
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const phaseLabel = progPhase === 'export' ? 'Export' : 'Capture';
  document.getElementById('progressPose').textContent = `${phaseLabel}  ${progCurrent} / ${progTotal}  (${pct.toFixed(0)}%)`;
  // Time
  if (progCurrent > 0 && progStartTime) {
    const elapsed = (Date.now() - progStartTime) / 1000;
    const eta = (elapsed / progCurrent) * (progTotal - progCurrent);
    document.getElementById('progressTime').textContent = `${fmtTime(elapsed)} elapsed · ~${fmtTime(eta)} left`;
  } else {
    document.getElementById('progressTime').textContent = '';
  }
}

function fmtTime(s) {
  s = Math.round(s);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), sec = s % 60;
  return m + 'm ' + (sec < 10 ? '0' : '') + sec + 's';
}

function resetProgress() {
  progTotal = 0; progCurrent = 0; progStartTime = 0; progPhase = 'capture';
  document.getElementById('progressWrap').classList.remove('visible');
}

// ─── Lightbox ───
let lbIndex = 0, lbFiles = [], lbSession = '', lbTab = 'rgb';

function lbFileGroup(filename) {
  // Group RGB/Depth/Normal by stripping _d.png / _n.png suffixes
  const base = filename.replace(/(_d|_n)\.png$/i, '.png');
  const group = { rgb: base };
  const depthName = base.replace(/\.png$/i, '_d.png');
  const normalName = base.replace(/\.png$/i, '_n.png');
  if (lbFiles.includes(depthName)) group.depth = depthName;
  if (lbFiles.includes(normalName)) group.normal = normalName;
  return group;
}

function lbRgbFiles() {
  // Return only RGB files (exclude _d.png and _n.png)
  return lbFiles.filter(f => !/_d\.png$/i.test(f) && !/_n\.png$/i.test(f));
}

function lbOpen(index) {
  lbSession = viewSession || activeSession;
  lbFiles = [...knownCaptures];
  const rgbList = lbRgbFiles();
  if (!rgbList.length) return;
  lbIndex = Math.max(0, Math.min(index, rgbList.length - 1));
  lbTab = 'rgb';
  lbRender();
  document.getElementById('lightbox').classList.add('open');
}

function lbClose() {
  document.getElementById('lightbox').classList.remove('open');
}

function lbClickBg(e) {
  if (e.target === document.getElementById('lightbox')) lbClose();
}

function lbNav(dir) {
  const rgbList = lbRgbFiles();
  lbIndex = (lbIndex + dir + rgbList.length) % rgbList.length;
  lbRender();
}

function lbSwitchTab(tab) {
  lbTab = tab;
  lbRender();
}

function lbRender() {
  const rgbList = lbRgbFiles();
  const rgbFile = rgbList[lbIndex];
  const group = lbFileGroup(rgbFile);

  // Tabs
  const tabsEl = document.getElementById('lbTabs');
  const tabs = [['rgb', 'RGB']];
  if (group.depth) tabs.push(['depth', 'Depth']);
  if (group.normal) tabs.push(['normal', 'Normal']);
  tabsEl.innerHTML = tabs.map(([k, label]) =>
    `<button class="lightbox-tab${lbTab === k ? ' active' : ''}" onclick="lbSwitchTab('${k}')">${label}</button>`
  ).join('');

  // If current tab not available, fall back to rgb
  if (!group[lbTab]) lbTab = 'rgb';

  // Image
  const file = group[lbTab] || rgbFile;
  const encodedPath = file.split('/').map(encodeURIComponent).join('/');
  const src = lbSession ? `/api/captures/${encodeURIComponent(lbSession)}/${encodedPath}` : '';
  document.getElementById('lbImg').src = src;

  // Label
  const name = file.split('/').pop();
  document.getElementById('lbLabel').textContent = `${lbIndex + 1} / ${rgbList.length}  —  ${name}`;
}

// ─── 3D Viewer ───
let view3dActive = false;
const cam3d = { rotX: -0.5, rotY: 0.6, dist: 20, cx: 0, cy: 1.5, cz: 0 };
let trajData = null;

function switchCenterTab(tab) {
  const logEl = document.getElementById('logBody');
  const progEl = document.getElementById('progressWrap');
  const canvas = document.getElementById('view3d');
  document.getElementById('tabLog').classList.toggle('active', tab === 'log');
  document.getElementById('tab3d').classList.toggle('active', tab === '3d');
  if (tab === '3d') {
    logEl.style.display = 'none';
    progEl.style.display = 'none';
    canvas.style.display = 'block';
    view3dActive = true;
    resizeCanvas3d();
    loadTrajectory();
    draw3d();
  } else {
    logEl.style.display = '';
    progEl.style.display = '';
    canvas.style.display = 'none';
    view3dActive = false;
  }
}

function resizeCanvas3d() {
  const c = document.getElementById('view3d');
  c.width = c.clientWidth * devicePixelRatio;
  c.height = c.clientHeight * devicePixelRatio;
}

async function loadTrajectory() {
  const sess = viewSession || activeSession;
  if (!sess) { trajData = null; return; }
  try {
    const r = await fetch(`/api/captures/${encodeURIComponent(sess)}/trajectory.json`);
    if (r.ok) trajData = await r.json();
    else trajData = null;
  } catch(_) { trajData = null; }
}

function project3d(x, y, z, w, h) {
  // Orbit camera projection
  const cosX = Math.cos(cam3d.rotX), sinX = Math.sin(cam3d.rotX);
  const cosY = Math.cos(cam3d.rotY), sinY = Math.sin(cam3d.rotY);
  let dx = x - cam3d.cx, dy = y - cam3d.cy, dz = z - cam3d.cz;
  // Rotate Y
  let rx = dx * cosY + dz * sinY, rz = -dx * sinY + dz * cosY;
  // Rotate X
  let ry = dy * cosX - rz * sinX;
  rz = dy * sinX + rz * cosX;
  rz -= cam3d.dist;
  if (rz > -0.1) return null;
  const fov = 800;
  const sx = w / 2 + (rx / -rz) * fov;
  const sy = h / 2 - (ry / -rz) * fov;
  return { x: sx, y: sy, z: rz };
}

function draw3d() {
  if (!view3dActive) return;
  const c = document.getElementById('view3d');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.save();

  // Bounding box from form
  const bmin = [pf('vol_min_x'), pf('vol_min_y'), pf('vol_min_z')];
  const bmax = [pf('vol_max_x'), pf('vol_max_y'), pf('vol_max_z')];

  // Draw bounding box edges
  const corners = [];
  for (let i = 0; i < 8; i++) {
    corners.push([
      i & 1 ? bmax[0] : bmin[0],
      i & 2 ? bmax[1] : bmin[1],
      i & 4 ? bmax[2] : bmin[2],
    ]);
  }
  const edges = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  ctx.strokeStyle = 'rgba(91,138,240,0.3)';
  ctx.lineWidth = devicePixelRatio;
  edges.forEach(([a, b]) => {
    const pa = project3d(...corners[a], w, h);
    const pb = project3d(...corners[b], w, h);
    if (pa && pb) { ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke(); }
  });

  // Draw grid on Y=bmin[1] plane
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  const step = pf('spacing') || 2;
  for (let x = bmin[0]; x <= bmax[0]; x += step) {
    const a = project3d(x, bmin[1], bmin[2], w, h);
    const b = project3d(x, bmin[1], bmax[2], w, h);
    if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }
  for (let z = bmin[2]; z <= bmax[2]; z += step) {
    const a = project3d(bmin[0], bmin[1], z, w, h);
    const b = project3d(bmax[0], bmin[1], z, w, h);
    if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }

  // Waypoints from trajectory
  const points = trajData || [];
  if (points.length) {
    // Path lines
    ctx.strokeStyle = 'rgba(62,207,142,0.5)';
    ctx.lineWidth = 1.5 * devicePixelRatio;
    ctx.beginPath();
    let started = false;
    points.forEach(p => {
      const pp = project3d(p.Position.x, p.Position.y, p.Position.z, w, h);
      if (pp) { if (!started) { ctx.moveTo(pp.x, pp.y); started = true; } else ctx.lineTo(pp.x, pp.y); }
    });
    ctx.stroke();

    // Dots
    points.forEach((p, i) => {
      const pp = project3d(p.Position.x, p.Position.y, p.Position.z, w, h);
      if (!pp) return;
      const r = 3 * devicePixelRatio;
      ctx.fillStyle = p.viewName === 'center' ? '#3ecf8e' : '#5b8af0';
      ctx.beginPath(); ctx.arc(pp.x, pp.y, r, 0, Math.PI * 2); ctx.fill();
    });
  }

  // Axes indicator (bottom-left)
  const axLen = 30 * devicePixelRatio;
  const ox = 40 * devicePixelRatio, oy = h - 40 * devicePixelRatio;
  [['X','#f03e3e',1,0,0],['Y','#3ecf8e',0,1,0],['Z','#5b8af0',0,0,1]].forEach(([label,color,ax,ay,az]) => {
    const p = project3d(cam3d.cx + ax * 2, cam3d.cy + ay * 2, cam3d.cz + az * 2, w, h);
    const o = project3d(cam3d.cx, cam3d.cy, cam3d.cz, w, h);
    if (!p || !o) return;
    const dx = p.x - o.x, dy = p.y - o.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const ex = ox + (dx/len) * axLen, ey = oy + (dy/len) * axLen;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = `${10 * devicePixelRatio}px sans-serif`;
    ctx.fillText(label, ex + 4, ey + 4);
  });

  ctx.restore();
}

// Orbit controls
(function init3dControls() {
  const c = document.getElementById('view3d');
  let dragging = false, lastX, lastY, button;
  c.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; button = e.button; c.style.cursor = 'grabbing'; });
  window.addEventListener('mousemove', e => {
    if (!dragging || !view3dActive) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (button === 0) { cam3d.rotY += dx * 0.008; cam3d.rotX += dy * 0.008; cam3d.rotX = Math.max(-1.5, Math.min(1.5, cam3d.rotX)); }
    if (button === 2) {
      const cosY = Math.cos(cam3d.rotY), sinY = Math.sin(cam3d.rotY);
      cam3d.cx -= (dx * cosY) * 0.02; cam3d.cz -= (-dx * sinY) * 0.02; cam3d.cy += dy * 0.02;
    }
    draw3d();
  });
  window.addEventListener('mouseup', () => { dragging = false; c.style.cursor = 'grab'; });
  c.addEventListener('wheel', e => { e.preventDefault(); cam3d.dist = Math.max(2, Math.min(100, cam3d.dist + e.deltaY * 0.02)); draw3d(); }, { passive: false });
  c.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', () => { if (view3dActive) { resizeCanvas3d(); draw3d(); } });
})();

// ─── Keyboard ───
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (lb.classList.contains('open')) {
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowLeft') lbNav(-1);
    else if (e.key === 'ArrowRight') lbNav(1);
    else if (e.key === '1') lbSwitchTab('rgb');
    else if (e.key === '2') lbSwitchTab('depth');
    else if (e.key === '3') lbSwitchTab('normal');
    return;
  }
  if (e.key === 'Escape') clearLogs();
});

// ─── Config Save/Load ───
async function loadSavedConfig() {
  try {
    const resp = await fetch('/api/config');
    const p = await resp.json();
    applyParams(p);
    addLog('Config restored from last session', 'info');
  } catch(_) {}
}

function saveConfig() {
  const data = getFormData();
  fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data),
  }).catch(()=>{});
}

// Auto-save on any form change
document.querySelectorAll('input, select').forEach(el => {
  el.addEventListener('change', saveConfig);
});

// ─── Profiles ───
async function loadProfiles() {
  try {
    const resp = await fetch('/api/config/profiles');
    const profiles = await resp.json();
    const el = document.getElementById('profileList');
    if (!profiles.length) { el.innerHTML = '<div class="cfg-empty">No saved configs</div>'; return; }
    el.innerHTML = '';
    profiles.forEach(p => {
      const row = document.createElement('div');
      row.className = 'cfg-row';
      row.onclick = () => loadProfile(p.name);
      row.innerHTML = `<span class="cfg-name">${p.name}</span><span class="cfg-meta">${p.driver}/${p.grabber}</span><button class="cfg-del" onclick="event.stopPropagation();deleteProfile('${p.name}')" title="Delete">&times;</button>`;
      el.appendChild(row);
    });
  } catch(_) {}
}

async function loadProfile(name) {
  try {
    const resp = await fetch(`/api/config/profiles/${encodeURIComponent(name)}`);
    const p = await resp.json();
    if (p.ok === false) { addLog('Profile not found: ' + name, 'error'); return; }
    applyParams(p);
    saveConfig();
    addLog(`Loaded config: ${name}`, 'success');
  } catch(_) {}
}

async function promptSaveProfile() {
  const name = prompt('Config name:');
  if (!name || !name.trim()) return;
  const clean = name.trim().replace(/[^a-zA-Z0-9_\-\u4e00-\u9fff]/g, '_');
  try {
    await fetch(`/api/config/profiles/${encodeURIComponent(clean)}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(getFormData()),
    });
    addLog(`Config saved: ${clean}`, 'success');
    loadProfiles();
  } catch(_) {}
}

async function deleteProfile(name) {
  try {
    await fetch(`/api/config/profiles/${encodeURIComponent(name)}`, { method: 'DELETE' });
    loadProfiles();
  } catch(_) {}
}

// ─── Recent ───
async function loadRecent() {
  try {
    const resp = await fetch('/api/config/recent');
    const recent = await resp.json();
    const el = document.getElementById('recentList');
    if (!recent.length) { el.innerHTML = '<div class="cfg-empty">No recent runs</div>'; return; }
    el.innerHTML = '';
    recent.slice(-3).forEach(r => {
      const row = document.createElement('div');
      row.className = 'cfg-row';
      row.onclick = () => { applyParams(r.config); saveConfig(); addLog('Restored recent config', 'info'); };
      row.innerHTML = `<span class="cfg-name">${r.driver}/${r.grabber} ${r.spacing}m</span><span class="cfg-meta">${r.timestamp}</span>`;
      el.appendChild(row);
    });
  } catch(_) {}
}

// ─── Init ───
loadSavedConfig();
updateVisibility();
loadPresets();
loadProfiles();
loadRecent();
setInterval(()=>{pollSessions();pollCaptures();},2000);
pollSessions();pollCaptures();
</script>
