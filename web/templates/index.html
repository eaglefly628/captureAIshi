<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>captureAIshi</title>
<style>
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-elevated: #1a1a1a;
  --bg-overlay: #222222;
  --bg-hover: rgba(255,255,255,0.04);
  --bg-selected: rgba(255,255,255,0.08);

  --border-subtle: rgba(255,255,255,0.08);
  --border-default: rgba(255,255,255,0.12);
  --border-strong: rgba(255,255,255,0.20);

  --text-primary: #ededed;
  --text-secondary: #a0a0a0;
  --text-tertiary: #5a5a5a;
  --text-placeholder: #3a3a3a;

  --accent: #5b8af0;
  --accent-hover: #7ba3f7;
  --accent-dim: rgba(91,138,240,0.15);
  --success: #3ecf8e;
  --success-dim: rgba(62,207,142,0.12);
  --warning: #f5a623;
  --warning-dim: rgba(245,166,35,0.10);
  --danger: #f03e3e;
  --danger-dim: rgba(240,62,62,0.10);
  --info: #60a5fa;
  --orange: #f5a623;

  --radius: 4px;
  --radius-md: 6px;

  --font: 'Inter', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }

body {
  font-family: var(--font);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-base);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

/* ─── Toolbar ─── */
.toolbar {
  height: 40px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  flex-shrink: 0;
  -webkit-app-region: drag;
}
.toolbar-logo {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-right: 4px;
}
.toolbar-logo b { color: var(--accent); font-weight: 600; }
.toolbar-sep {
  width: 1px;
  height: 16px;
  background: var(--border-default);
}
.toolbar-spacer { flex: 1; }

/* Buttons */
.btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.1s, border-color 0.1s;
  -webkit-app-region: no-drag;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-overlay); border-color: var(--border-strong); }
.btn:active { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger {
  background: var(--danger-dim);
  border-color: rgba(240,62,62,0.3);
  color: var(--danger);
}
.btn-danger:hover { background: rgba(240,62,62,0.18); }

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius);
}
.badge-idle { background: var(--bg-selected); color: var(--text-secondary); }
.badge-running { background: var(--success-dim); color: var(--success); }
.badge-error { background: var(--danger-dim); color: var(--danger); }
.badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.badge-running .dot { animation: pulse 1.5s infinite; }
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Select */
.sel {
  font-family: var(--font);
  font-size: 12px;
  height: 28px;
  padding: 0 24px 0 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l3 3 3-3' stroke='%235a5a5a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 7px center;
}
.sel:hover { border-color: var(--border-strong); }
.sel:focus { outline: none; border-color: var(--accent); }

/* Toggle */
.tog { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text-secondary); user-select: none; }
.tog input { display: none; }
.tog .track {
  width: 32px; height: 18px;
  background: rgba(255,255,255,0.12);
  border-radius: 9px;
  position: relative;
  transition: background 0.15s;
  flex-shrink: 0;
}
.tog .track::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform 0.15s;
}
.tog input:checked + .track { background: var(--success); }
.tog input:checked + .track::after { transform: translateX(14px); }

/* ─── Layout ─── */
.layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ─── Left Sidebar (Params) ─── */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 8px 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

/* Sections */
.sec { border-bottom: 1px solid var(--border-subtle); }
.sec:last-child { border-bottom: none; }
.sec-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
  background: none;
  border: none;
  width: 100%;
  font-family: var(--font);
}
.sec-head:hover { color: var(--text-primary); }
.sec-head .arr {
  font-size: 8px;
  color: var(--text-tertiary);
  transition: transform 0.12s;
  display: inline-block;
}
.sec-head.open .arr { transform: rotate(90deg); }
.sec-body { display: none; padding: 4px 12px 8px; }
.sec-body.open { display: block; }

/* Form fields */
.f { margin-bottom: 6px; }
.f:last-child { margin-bottom: 0; }
.f label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-tertiary);
  margin-bottom: 3px;
}
.f input, .f select {
  width: 100%;
  font-family: var(--font);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  background: var(--bg-base);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  padding: 4px 8px;
  height: 28px;
  transition: border-color 0.1s;
}
.f input:focus, .f select:focus {
  outline: none;
  border-color: var(--accent);
}
.f input::placeholder { color: var(--text-placeholder); }
.row { display: flex; gap: 6px; }
.row .f { flex: 1; min-width: 0; }

/* Presets (compact list) */
.preset-list { display: flex; flex-direction: column; gap: 2px; }
.preset-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.preset-item:hover { background: var(--bg-hover); }
.preset-item.selected { background: var(--accent-dim); border-color: rgba(91,138,240,0.25); }
.preset-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
.pi-name { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.pi-tags { display: flex; gap: 3px; margin-left: auto; }
.pi-tag {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(255,255,255,0.06);
  color: var(--text-tertiary);
}
.preset-item.selected .pi-tag { background: rgba(91,138,240,0.2); color: var(--accent); }

/* ─── Center (Log) ─── */
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.center-header {
  height: 32px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.log-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  background: var(--bg-base);
}
.log-line {
  padding: 1px 12px 1px 10px;
  border-left: 2px solid transparent;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-info { color: var(--text-secondary); }
.log-warn { color: var(--warning); border-left-color: var(--warning); background: var(--warning-dim); }
.log-error { color: var(--danger); border-left-color: var(--danger); background: var(--danger-dim); }
.log-success { color: var(--success); border-left-color: var(--success); background: var(--success-dim); }
.log-capture { color: var(--info); border-left-color: var(--info); background: rgba(96,165,250,0.06); }
.log-progress { color: var(--orange); border-left-color: var(--orange); }

/* ─── Right Panel (Preview) ─── */
.preview {
  width: 320px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-header {
  height: 32px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.preview-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  align-content: start;
}
.preview-card {
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: border-color 0.1s;
}
.preview-card:hover { border-color: var(--border-strong); }
.preview-card img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: var(--bg-elevated);
}
.preview-card .pc-label {
  padding: 3px 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.preview-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 32px 12px;
  color: var(--text-tertiary);
  font-size: 12px;
  line-height: 1.6;
}

/* ─── Status Bar ─── */
.statusbar {
  height: 24px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  gap: 16px;
}
.statusbar-spacer { flex: 1; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <span class="toolbar-logo"><b>capture</b>AIshi</span>
  <div class="toolbar-sep"></div>
  <button class="btn btn-accent" id="btnStart" onclick="startCapture()">&#9654;&#xFE0E; Start</button>
  <button class="btn btn-danger" id="btnStop" onclick="stopCapture()" style="display:none">&#9632;&#xFE0E; Stop</button>
  <div class="toolbar-sep"></div>
  <select class="sel" id="presetSelect" onchange="selectPresetById(this.value)">
    <option value="">Preset...</option>
  </select>
  <select class="sel" id="driver" onchange="updateVisibility()">
    <option value="manual">Manual</option>
    <option value="ue5">UE5</option>
    <option value="unity">Unity</option>
    <option value="cheatengine">CE</option>
  </select>
  <select class="sel" id="grabber" onchange="updateVisibility()">
    <option value="none">No Grab</option>
    <option value="renderdoc">RenderDoc</option>
    <option value="screenshot">Screenshot</option>
  </select>
  <div class="toolbar-sep"></div>
  <label class="tog"><input type="checkbox" id="clean_start" checked><div class="track"></div>Clean</label>
  <label class="tog"><input type="checkbox" id="dry_run"><div class="track"></div>Dry</label>
  <div class="toolbar-spacer"></div>
  <div id="statusBadge" class="badge badge-idle"><div class="dot"></div><span id="statusText">Idle</span></div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">Parameters</div>
    <div class="sidebar-body">

      <!-- Presets -->
      <div class="sec">
        <button class="sec-head open" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Presets</button>
        <div class="sec-body open"><div class="preset-list" id="presetList"></div></div>
      </div>

      <!-- Volume -->
      <div class="sec">
        <button class="sec-head open" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Capture Volume</button>
        <div class="sec-body open">
          <div class="f"><label>Min (X, Y, Z)</label>
            <div class="row">
              <div class="f"><input type="number" id="vol_min_x" value="-5" step="0.5"></div>
              <div class="f"><input type="number" id="vol_min_y" value="0" step="0.5"></div>
              <div class="f"><input type="number" id="vol_min_z" value="-5" step="0.5"></div>
            </div>
          </div>
          <div class="f"><label>Max (X, Y, Z)</label>
            <div class="row">
              <div class="f"><input type="number" id="vol_max_x" value="5" step="0.5"></div>
              <div class="f"><input type="number" id="vol_max_y" value="3" step="0.5"></div>
              <div class="f"><input type="number" id="vol_max_z" value="5" step="0.5"></div>
            </div>
          </div>
          <div class="f"><label>Spacing (m)</label><input type="number" id="spacing" value="2.0" step="0.1" min="0.1"></div>
        </div>
      </div>

      <!-- Path -->
      <div class="sec">
        <button class="sec-head" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Path</button>
        <div class="sec-body">
          <label class="tog" style="margin-bottom:6px"><input type="checkbox" id="smooth" onchange="updateVisibility()"><div class="track"></div>Smooth Path</label>
          <div class="f" id="smoothPointsWrap"><label>Points / Segment</label><input type="number" id="smooth_points" value="5" min="2" max="50"></div>
        </div>
      </div>

      <!-- Cone Rotation -->
      <div class="sec">
        <button class="sec-head" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Cone Rotation</button>
        <div class="sec-body">
          <div class="f"><label>Half Angle (0=off)</label><input type="number" id="cone_angle" value="0" step="1" min="0" max="90"></div>
          <div class="row">
            <div class="f"><label>Ring Samples</label><input type="number" id="cone_samples" value="8" min="1"></div>
            <div class="f"><label>Rings</label><input type="number" id="cone_rings" value="2" min="1"></div>
          </div>
        </div>
      </div>

      <!-- Connection -->
      <div class="sec">
        <button class="sec-head" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Connection</button>
        <div class="sec-body">
          <div class="row">
            <div class="f"><label>Host</label><input type="text" id="driver_host" value="127.0.0.1"></div>
            <div class="f"><label>Port</label><input type="number" id="driver_port" value="9999"></div>
          </div>
          <div class="f" id="ceModeWrap"><label>CE Mode</label>
            <select id="ce_mode"><option value="file">File</option><option value="socket">Socket</option></select>
          </div>
          <div class="f" id="targetExeWrap"><label>Target Exe</label><input type="text" id="target_exe" placeholder="/path/to/game.exe"></div>
        </div>
      </div>

      <!-- Streaming -->
      <div class="sec">
        <button class="sec-head" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Streaming</button>
        <div class="sec-body">
          <label class="tog" style="margin-bottom:6px"><input type="checkbox" id="streaming" checked onchange="updateVisibility()"><div class="track"></div>Streaming Mgmt</label>
          <div class="f" id="streamingSettleWrap"><label>Settle (s)</label><input type="number" id="streaming_settle" value="0.5" step="0.1" min="0" max="10"></div>
        </div>
      </div>

      <!-- Options -->
      <div class="sec">
        <button class="sec-head" onclick="toggleSec(this)"><span class="arr">&#9654;&#xFE0E;</span> Options</button>
        <div class="sec-body">
          <label class="tog" style="margin-bottom:6px"><input type="checkbox" id="no_hide_ui"><div class="track"></div>Disable UI Hiding</label>
          <div class="f"><label>Output Dir</label><input type="text" id="output_dir" value="./output"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Center: Log -->
  <div class="center">
    <div class="center-header">
      <span>Output</span>
      <span id="logCount" style="font-weight:400;text-transform:none;letter-spacing:0">0 lines</span>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-line log-info">$ captureAIshi ready</div>
    </div>
  </div>

  <!-- Right: Preview -->
  <div class="preview">
    <div class="preview-header">
      <select class="sel" id="sessionSelect" onchange="switchSession(this.value)" style="height:24px;font-size:11px;padding-left:6px;">
        <option value="">Captures</option>
      </select>
      <span id="captureCount" style="font-size:10px;color:var(--text-tertiary)">0</span>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-empty">No captures yet</div>
    </div>
  </div>

</div>

<!-- Status Bar -->
<div class="statusbar">
  <span id="configSummary">No preset</span>
  <div class="statusbar-spacer"></div>
  <span>captureAIshi v1.0</span>
</div>

<script>
// ─── State ───
let polling = null, presets = [], selectedPresetId = null;
let knownCaptures = [], activeSession = '', viewSession = '';

// ─── Sections ───
function toggleSec(btn) { btn.classList.toggle('open'); btn.nextElementSibling.classList.toggle('open'); }

// ─── Presets ───
const presetIcons = { gamepad:'\u{1F3AE}', cube:'\u{1F4E6}', unity:'\u{1F3AE}', wrench:'\u{1F527}', flask:'\u{1F9EA}' };

async function loadPresets() {
  try {
    const r = await fetch('/api/presets');
    presets = await r.json();
    const sel = document.getElementById('presetSelect');
    sel.innerHTML = '<option value="">Preset...</option>';
    presets.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    renderPresetList();
  } catch(e) { console.error(e); }
}

function renderPresetList() {
  const list = document.getElementById('presetList');
  list.innerHTML = '';
  presets.forEach(p => {
    const icon = presetIcons[p.icon] || '\u{1F4CB}';
    const d = document.createElement('div');
    d.className = 'preset-item';
    d.dataset.id = p.id;
    d.onclick = () => selectPresetById(p.id);
    d.innerHTML = `<span class="preset-icon">${icon}</span><span class="pi-name">${p.name}</span><span class="pi-tags">${p.tags.map(t=>`<span class="pi-tag">${t}</span>`).join('')}</span>`;
    list.appendChild(d);
  });
}

function selectPresetById(id) {
  if (!id) return;
  selectedPresetId = id;
  const preset = presets.find(p => p.id === id);
  if (!preset) return;
  document.getElementById('presetSelect').value = id;
  document.querySelectorAll('.preset-item').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
  applyParams(preset.params);
  const dl = {manual:'Manual',ue5:'UE5',unity:'Unity',cheatengine:'CE'};
  const gl = {none:'None',renderdoc:'RDoc',screenshot:'Scrn'};
  document.getElementById('configSummary').textContent = `${preset.name} \u2022 ${dl[preset.params.driver]||preset.params.driver} \u2022 ${gl[preset.params.grabber]||preset.params.grabber} \u2022 ${preset.params.spacing}m`;
  addLog(`Preset: ${preset.name}`, 'info');
}

function applyParams(p) {
  document.getElementById('vol_min_x').value=p.volume_min[0]; document.getElementById('vol_min_y').value=p.volume_min[1]; document.getElementById('vol_min_z').value=p.volume_min[2];
  document.getElementById('vol_max_x').value=p.volume_max[0]; document.getElementById('vol_max_y').value=p.volume_max[1]; document.getElementById('vol_max_z').value=p.volume_max[2];
  document.getElementById('spacing').value=p.spacing;
  document.getElementById('smooth').checked=p.smooth; document.getElementById('smooth_points').value=p.smooth_points;
  document.getElementById('cone_angle').value=p.cone_angle; document.getElementById('cone_samples').value=p.cone_samples; document.getElementById('cone_rings').value=p.cone_rings;
  document.getElementById('driver').value=p.driver; document.getElementById('driver_host').value=p.driver_host; document.getElementById('driver_port').value=p.driver_port;
  document.getElementById('ce_mode').value=p.ce_mode; document.getElementById('grabber').value=p.grabber;
  document.getElementById('target_exe').value=p.target_exe||''; document.getElementById('no_hide_ui').checked=p.no_hide_ui;
  document.getElementById('output_dir').value=p.output_dir; document.getElementById('dry_run').checked=p.dry_run;
  document.getElementById('streaming').checked=p.streaming!==false; document.getElementById('streaming_settle').value=p.streaming_settle||0.5;
  updateVisibility();
}

// ─── Form ───
function pf(id){return parseFloat(document.getElementById(id).value)||0;}
function pi(id){return parseInt(document.getElementById(id).value)||0;}
function val(id){return document.getElementById(id).value;}
function cb(id){return document.getElementById(id).checked;}

function getFormData() {
  return {
    volume_min:[pf('vol_min_x'),pf('vol_min_y'),pf('vol_min_z')],
    volume_max:[pf('vol_max_x'),pf('vol_max_y'),pf('vol_max_z')],
    spacing:pf('spacing'), smooth:cb('smooth'), smooth_points:pi('smooth_points'),
    cone_angle:pf('cone_angle'), cone_samples:pi('cone_samples'), cone_rings:pi('cone_rings'),
    driver:val('driver'), driver_host:val('driver_host'), driver_port:pi('driver_port'), ce_mode:val('ce_mode'),
    grabber:val('grabber'), target_exe:val('target_exe'), no_hide_ui:cb('no_hide_ui'),
    output_dir:val('output_dir'), dry_run:cb('dry_run'), clean_start:cb('clean_start'),
    streaming:cb('streaming'), streaming_settle:pf('streaming_settle'),
  };
}

// ─── Capture ───
async function startCapture() {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(getFormData()) });
    const r = await resp.json();
    if (!r.ok) { addLog('ERROR: '+r.error,'error'); btn.disabled=false; return; }
    setBadge('running');
    btn.style.display='none';
    document.getElementById('btnStop').style.display='';
    startPolling();
  } catch(e) { addLog('ERROR: '+e.message,'error'); btn.disabled=false; }
}
function stopCapture() { addLog('Stop requested...','warn'); }

function startPolling() {
  if(polling) clearInterval(polling);
  let last=0;
  polling = setInterval(async()=>{
    try {
      const r = await(await fetch('/api/status')).json();
      if(r.logs.length>last){ for(let i=last;i<r.logs.length;i++) addLog(r.logs[i]); last=r.logs.length; }
      if(!r.running){
        clearInterval(polling); polling=null;
        document.getElementById('btnStart').disabled=false;
        document.getElementById('btnStart').style.display='';
        document.getElementById('btnStop').style.display='none';
        if(r.error){ setBadge('error'); addLog('FAILED: '+r.error,'error'); }
        else { setBadge('idle'); addLog('Capture finished.','success'); }
      }
    } catch(_){}
  },500);
}

// ─── Log ───
function classifyLog(t) {
  const l=t.toLowerCase();
  if(l.includes('[error]')||l.includes('failed')||l.includes('exception')||l.includes('traceback')) return 'error';
  if(l.includes('[warning]')||l.includes('[warn]')||l.includes('timeout')||l.includes('retry')) return 'warn';
  if(l.includes('saved')||l.includes('complete')||l.includes('finished')||l.includes('success')||l.includes('done')) return 'success';
  if(l.includes('captured')||l.includes('frame')||l.includes('grabbed')||l.includes('screenshot')) return 'capture';
  if(/\d+\s*\/\s*\d+/.test(l)||l.includes('progress')||l.includes('waypoint')||l.includes('moving')) return 'progress';
  return 'info';
}
function addLog(text, force) {
  const body=document.getElementById('logBody');
  const d=document.createElement('div');
  d.className='log-line log-'+(force||classifyLog(text));
  d.textContent=text;
  body.appendChild(d);
  body.scrollTop=body.scrollHeight;
  document.getElementById('logCount').textContent=body.children.length+' lines';
}
function clearLogs(){ document.getElementById('logBody').innerHTML=''; document.getElementById('logCount').textContent='0 lines'; }
function setBadge(s) {
  const b=document.getElementById('statusBadge'), t=document.getElementById('statusText');
  b.className='badge badge-'+s;
  t.textContent=s.charAt(0).toUpperCase()+s.slice(1);
}

// ─── Visibility ───
function updateVisibility() {
  const h=(id,hide)=>{const el=document.getElementById(id);if(el)el.classList.toggle('hidden',hide);};
  h('smoothPointsWrap',!cb('smooth'));
  h('ceModeWrap',val('driver')!=='cheatengine');
  h('targetExeWrap',val('grabber')!=='renderdoc');
  h('streamingSettleWrap',!cb('streaming'));
}

// ─── Preview ───
async function pollSessions() {
  try {
    const d=await(await fetch('/api/sessions')).json();
    const sel=document.getElementById('sessionSelect');
    const cur=sel.value;
    sel.innerHTML='<option value="">All</option>';
    d.sessions.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    if(d.active&&d.active!==activeSession){activeSession=d.active;viewSession=d.active;sel.value=d.active;}
    else{sel.value=viewSession||cur;}
  } catch(_){}
}
function switchSession(s){viewSession=s;knownCaptures=[];pollCaptures();}
async function pollCaptures() {
  try {
    const url=viewSession?`/api/captures/${encodeURIComponent(viewSession)}`:'/api/captures';
    const d=await(await fetch(url)).json();
    if(d.files&&(d.files.length!==knownCaptures.length||d.session!==activeSession)){knownCaptures=d.files;renderPreviews(d.session);}
  } catch(_){}
}
function renderPreviews(session) {
  const body=document.getElementById('previewBody');
  document.getElementById('captureCount').textContent=knownCaptures.length;
  if(!knownCaptures.length){body.innerHTML='<div class="preview-empty">No captures yet</div>';return;}
  body.innerHTML='';
  const sess=session||viewSession||activeSession;
  [...knownCaptures].reverse().forEach(f=>{
    const c=document.createElement('div');c.className='preview-card';
    const src=sess?`/api/captures/${encodeURIComponent(sess)}/${encodeURIComponent(f)}`:'';
    c.innerHTML=`<img src="${src}" loading="lazy" alt="${f}"><div class="pc-label">${f.split('/').pop()}</div>`;
    body.appendChild(c);
  });
}

// ─── Keyboard ───
document.addEventListener('keydown',e=>{ if(e.key==='Escape') clearLogs(); });

// ─── Init ───
updateVisibility();
loadPresets();
setInterval(()=>{pollSessions();pollCaptures();},2000);
pollSessions();pollCaptures();
</script>
