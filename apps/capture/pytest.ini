[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -q
# Global per-test timeout -- any test stuck >20s is killed and reported as fail.
# pytest-timeout uses SIGALRM on POSIX / thread timer on Windows, so even tests
# that deadlock in C code will be terminated. Override with @pytest.mark.timeout(N).
timeout = 20
timeout_method = thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
