# Lightweight WordPress stack for the 爱萌 marketing site, co-located with
# the captureaishi-demo container on the same 2 GB ECS. Total RAM under
# 600 MB at idle so the demo container keeps its slice.
#
# Listens on host port 8081 (HTTP). 8080 is reserved for the demo. Avoid
# 80/443 in 国内 region without ICP filing.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Cut MySQL's footprint from ~600 MB to ~200 MB. Safe for low-traffic
    # marketing site (single-digit concurrent visitors).
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=4M
      --max-connections=20
      --table-open-cache=64
      --performance-schema=OFF
      --skip-name-resolve
    volumes:
      - ./db-data:/var/lib/mysql
    mem_limit: 280m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.5-php8.2-fpm-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '96M');
        define('WP_MAX_MEMORY_LIMIT', '128M');
        define('DISABLE_WP_CRON', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - ./wp-data:/var/www/html
    mem_limit: 220m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8081:80"
    volumes:
      - ./wp-data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 50m
